plugins {
	id 'org.springframework.boot' version '3.4.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.hidetake.swagger.generator' version '2.19.2'
	id 'java'
}

group = 'com.datasoft.bkash'
version = '1.0.0'
java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	jcenter()
	maven { url 'https://repo.spring.io/snapshot' }
	maven { url 'https://repo.spring.io/milestone' }
	maven { url 'https://jaspersoft.jfrog.io/artifactory/third-party-ce-artifacts/' }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'com.querydsl:querydsl-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	runtimeOnly 'mysql:mysql-connector-java'
	implementation 'mysql:mysql-connector-java:8.0.33'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	implementation 'com.google.guava:guava:32.0.1-jre'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	implementation 'org.jsoup:jsoup:1.11.3'
	implementation 'jakarta.transaction:jakarta.transaction-api:2.0.1'
	implementation 'com.atomikos:transactions-jta:5.0.8'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.4'
//	implementation 'org.springdoc:springdoc-openapi-ui:1.6.14'
//	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'
//	implementation 'org.springdoc:springdoc-openapi-starter-common:2.3.0'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.aspectj:aspectjtools:1.9.21'
	implementation 'com.google.code.gson:gson'

	implementation 'com.github.mwiede:jsch:0.2.15'
	implementation 'com.sun.jersey:jersey-client:1.12'

	implementation 'com.giffing.bucket4j.spring.boot.starter:bucket4j-spring-boot-starter:0.2.0'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'org.ehcache:ehcache:3.10.8'
	implementation 'javax.xml.bind:jaxb-api:2.3.1'
	implementation 'org.glassfish.jaxb:jaxb-runtime:2.3.1'
	implementation group: 'commons-io', name: 'commons-io', version: '2.18.0'
	implementation 'commons-codec:commons-codec:1.15'
	implementation 'org.apache.httpcomponents:httpclient:4.5'
	implementation 'org.apache.httpcomponents:httpcore:4.4.3'

	implementation 'org.springframework.boot:spring-boot-starter-hateoas'
	implementation 'org.apache.poi:poi:5.2.3'
	implementation 'org.apache.poi:poi-ooxml:5.2.3'
	implementation 'org.json:json:20231013'
	implementation 'org.springframework.boot:spring-boot-starter-batch'
	implementation 'com.github.librepdf:openpdf:1.3.30'
	implementation group: 'org.springframework.boot', name: 'spring-boot-starter-amqp'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client:4.2.0'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-zuul:2.2.10.RELEASE'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.apache.commons:commons-text:1.10.0'


}

tasks.withType(Test) {
	scanForTestClasses = false
	include "**/*Test.class"
}

//test {
//	useJUnitPlatform()
//}
sourceSets.configureEach { sourceSet ->
	tasks.named(sourceSet.compileJavaTaskName).configure {
		options.annotationProcessorGeneratedSourcesDirectory = file("$buildDir/generated/sources/java")
	}
}
